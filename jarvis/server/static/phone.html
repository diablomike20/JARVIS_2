<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis · telefon</title>
<style>body{margin:0;background:#061321;color:#d5eef7;font:16px system-ui}main{max-width:750px;margin:auto;padding:20px}h1{color:#81e5ef;font-size:22px}input,textarea,button{box-sizing:border-box;border:1px solid #356677;border-radius:9px;padding:12px;background:#102a3a;color:inherit;font:inherit}input,textarea{width:100%;margin:8px 0}button{cursor:pointer}#messages{min-height:30vh;max-height:58vh;overflow:auto;margin:20px 0}.message{white-space:pre-wrap;background:#0b2233;padding:12px;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}.user{border-left:3px solid #73e4e4}.assistant{border-left:3px solid #a8c5ff}.error{color:#ffb4a7}.info{font-size:13px;color:#98acb9}.row{display:flex;gap:8px;flex-wrap:wrap}#chat{display:none}#confirm{border:1px solid #e4bd66;padding:12px}small{color:#98acb9}</style>
<script src="/phone.js" defer></script></head><body><main><h1>JARVIS · telefon</h1><p id="status" aria-live="polite">Kapcsolódás…</p><section id="login"><p>A gépen nyisd meg: Beállítások → Munkaterület → Telefon.</p><form id="pair"><input id="token" type="password" autocomplete="off" placeholder="Párosítási kód" aria-label="Párosítási kód" required><button>Párosítás</button></form><small>A kódot csak a saját helyi hálózatodon használd.</small></section>
<section id="chat"><div class="row"><button id="cancel">Feladat megszakítása</button><button id="stop">Hang leállítása</button><button id="logout">Kijelentkezés</button></div><div id="messages" aria-live="polite"></div><div id="confirm" hidden></div><form id="send"><textarea id="text" rows="3" placeholder="Írj Jarvisnak…" aria-label="Üzenet"></textarea><div class="row"><button>Küldés</button><button id="mic" type="button">Mikrofon</button></div></form><p><small>A telefon és a számítógép ugyanazt az aktív munkamenetet használja. A mikrofonhoz a böngésző HTTPS-kapcsolatot kérhet.</small></p></section></main></body></html>
