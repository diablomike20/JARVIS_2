name: NG integration checks
on:
  push:
    branches: [codex/ng-integration]
  pull_request:
    paths:
      - 'jarvis/**'
      - 'tests/**'
      - 'web/**'
      - 'requirements*.txt'
      - '.github/workflows/ng-checks.yml'
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install fastapi python-multipart httpx pydantic pyyaml python-dotenv rich psutil numpy edge-tts -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
